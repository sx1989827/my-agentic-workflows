name: Support hours tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Reviewed PR head commit SHA to test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run policy tests
        run: node --test test/support-hours.test.mjs